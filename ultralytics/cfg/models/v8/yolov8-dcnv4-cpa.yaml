# YOLOv8 + CPA-Enhancer + DCNv4 for industrial defect detection
# CPA-Enhancer: Chain-of-Thought Prompted Adaptive Enhancer
# DCNv4: Deformable Convolution v4 with grouped offset sharing & spatial aggregation

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cpa.yaml' will call yolov8-cpa.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, CPA_arch, [3, 3, 4]]    # 0 CPA-Enhancer: c_in=3, c_out=3, dim=4
  - [-1, 1, DCNv4, [64, 3, 2, 1, 4]]      # 1-P1/2 DCNv4: c2, k, s, p, groups
  - [-1, 1, DCNv4, [128, 3, 2, 1, 4]]     # 2-P2/4 DCNv4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, DCNv4, [256, 3, 2, 1, 4]]     # 4-P3/8 DCNv4
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, DCNv4, [512, 3, 2, 1, 4]]     # 6-P4/16 DCNv4
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, DCNv4, [1024, 3, 2, 1, 4]]    # 8-P5/32 DCNv4
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 10

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 3, C2f, [128]] # 19 (P2/4-xsmall)

  - [-1, 1, DCNv4, [128, 3, 2, 1, 4]]    # 20 DCNv4
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 3, C2f, [256]] # 22 (P3/8-small)

  - [-1, 1, DCNv4, [256, 3, 2, 1, 4]]    # 23 DCNv4
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 25 (P4/16-medium)

  - [-1, 1, DCNv4, [512, 3, 2, 1, 4]]    # 26 DCNv4
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
